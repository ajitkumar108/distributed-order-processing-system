# Name of this application (shown in logs).
spring.application.name=service-registry

# Eureka dashboard + API port. Open http://localhost:8761
server.port=8761

# The registry itself should NOT register into another registry...
eureka.client.register-with-eureka=false
# ...and does not need to download a copy of the registry from anyone.
eureka.client.fetch-registry=false

# Dev convenience: remove dead instances quickly instead of keeping them "just in case".
eureka.server.enable-self-preservation=false

# Expose only the health endpoint (used by Docker/monitoring).
management.endpoints.web.exposure.include=health,info
