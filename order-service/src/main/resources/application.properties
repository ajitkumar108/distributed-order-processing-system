# ======================= ORDER SERVICE CONFIG =======================
# ${NAME:default} = take environment variable NAME, otherwise use the default after the colon.

# Name registered in Eureka (shows up as ORDER-SERVICE). The gateway route uses this name.
spring.application.name=order-service
server.port=8080

# ----- Database (MySQL) -----
# createDatabaseIfNotExist=true: MySQL creates order_db automatically on first start.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true}
spring.datasource.username=root
# NO default on purpose: never commit passwords. Set DB_PASSWORD in your environment / IDE run config / .env
spring.datasource.password=Ajit@12345

# "update" = Hibernate creates/updates tables automatically (great for learning; use Flyway/Liquibase in real projects).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Don't keep a DB session open during the web request rendering (avoids lazy-loading surprises).
spring.jpa.open-in-view=false

# ----- Kafka -----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer: ONE group id for this service (declared here only, never in the annotation!).
spring.kafka.consumer.group-id=order-service-group
# If the group has no saved offset yet, start from the beginning of the topic instead of the end.
spring.kafka.consumer.auto-offset-reset=earliest
# We exchange plain JSON text, so keys and values are Strings; we convert JSON <-> object ourselves.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Wait until the broker confirms the write, and avoid duplicates caused by producer retries.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Make Kafka sends/receives show up as spans in Zipkin (trace continues across services).
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# ----- Eureka -----
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# ----- Actuator + Tracing -----
management.endpoints.web.exposure.include=health,info
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
# Put traceId/spanId in every log line (find one request across all services' logs).
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]

# ----- Saga recovery job -----
saga.recovery.stuck-after-seconds=60
saga.recovery.max-retries=5
saga.recovery.interval-ms=30000
